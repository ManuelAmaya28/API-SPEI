spring:

  # ─── DataSource (H2 file — swap for PostgreSQL via env vars) ──────────────
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/spei;AUTO_SERVER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: org.h2.Driver

  # ─── JPA / Hibernate ──────────────────────────────────────────────────────
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
  sql:
    init:
      mode: always

  # ─── H2 Console (dev convenience) ─────────────────────────────────────────
  h2:
    console:
      enabled: true
      path: /h2-console

  # ─── Security / Keycloak JWKS ─────────────────────────────────────────────
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://auth.lab.dnu.mx/realms/fineract_keycloak}

# ─── Actuator ───────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# ─── SPEI business configuration ────────────────────────────────────────────
spei:
  fineract:
    base-url: ${FINERACT_BASE_URL:https://fineract.lab.dnu.mx/fineract-provider/api/v1}
    username: ${FINERACT_USERNAME:mifos}
    password: ${FINERACT_PASSWORD:password}
    tenant-id: ${FINERACT_TENANT_ID:default}
  spread-rate: ${SPEI_SPREAD_RATE:0.005}
  commission: ${SPEI_COMMISSION:8.00}
  payment-type-id: ${SPEI_PAYMENT_TYPE_ID:3}
